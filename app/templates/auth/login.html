<!DOCTYPE html>
<html lang="{{ locale or 'fr' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ _("Connexion") }} - Accura SYCEBNL</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <h1 class="text-2xl font-bold text-center mb-2 text-blue-800">Accura SYCEBNL</h1>
        <h2 class="text-xl font-semibold text-center mb-6 text-gray-600">{{ _("Connexion") }}</h2>

        {% if error %}
        <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4" role="alert">
            {{ tmsg(error) }}
        </div>
        {% endif %}

        <form action="/auth/login" method="POST" class="space-y-4">
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700">{{ _("Email") }}</label>
                <input type="email" name="email" id="email" required
                       class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700">{{ _("Mot de passe") }}</label>
                <input type="password" name="password" id="password" required
                       class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
            </div>

            <button type="submit"
                    class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700">
                {{ _("Se connecter") }}
            </button>
        </form>

        <div class="mt-6 text-center text-sm space-x-3">
            <a href="?lang=fr" class="text-blue-600 hover:underline">Français</a>
            <a href="?lang=en" class="text-blue-600 hover:underline">English</a>
        </div>
    </div>
</body>
</html>
