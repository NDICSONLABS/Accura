{% extends "base.html" %}
{% block content %}
<div class="max-w-7xl mx-auto">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold">{{ _("Chart of Accounts") }}</h1>
    </div>

    <div class="bg-white p-4 rounded-lg shadow mb-6">
        <label class="block text-sm font-medium text-gray-700 mb-1">
            {{ _("Search") }}
        </label>

        <input
            type="text"
            name="search"
            value="{{ search }}"
            placeholder="{{ _('Search by account code or label') }}"
            hx-get="/accounting/coa/"
            hx-trigger="keyup changed delay:300ms"
            hx-target="#coa-rows"
            hx-swap="innerHTML"
            class="w-full md:w-1/3 px-4 py-2 border rounded focus:ring-2 focus:ring-blue-500"
        >
    </div>

    <div class="bg-white rounded-lg shadow overflow-x-auto">
        <table class="w-full text-left text-sm">
            <thead class="bg-slate-800 text-white uppercase text-xs">
                <tr>
                    <th class="p-3">{{ _("Code") }}</th>
                    <th class="p-3">{{ _("Label") }}</th>
                    <th class="p-3">{{ _("Class") }}</th>
                    <th class="p-3">{{ _("Normal Balance") }}</th>
                    <th class="p-3">{{ _("Postable") }}</th>
                    <th class="p-3">{{ _("Third Party Required") }}</th>
                    <th class="p-3">{{ _("Status") }}</th>
                </tr>
            </thead>

            <tbody id="coa-rows" class="divide-y divide-gray-200 bg-white">
                {% include "accounting/_coa_rows.html" %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
