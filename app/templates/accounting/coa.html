{% extends "base.html" %}
{% block content %}
<div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold">{{ _("Chart of Accounts") }}</h1>
    <button hx-get="/accounting/coa/modal" hx-target="#modal" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">+ Nouveau Compte</button>
</div>

<div class="bg-white rounded-lg shadow overflow-hidden">
    <div class="p-4 border-b">
        <input type="text" name="search" placeholder="Rechercher par code ou libellé..." 
               hx-get="/accounting/coa/" hx-trigger="keyup changed delay:300ms" hx-target="#coa-table-body" 
               class="w-full md:w-1/3 px-4 py-2 border rounded focus:ring-2 focus:ring-blue-500" value="{{ search }}">
   2</div>
    <table class="w-full text-left">
        <thead class="bg-gray-50 text-gray-600 uppercase text-sm">
            <tr>
                <th class="p-4">Code</th>
                <th class="p-4">Libellé</th>
                <th class="p-4">Classe</th>
                <th class="p-4">Solde Normal</th>
                <th class="p-4">Postable</th>
                <th class="p-4">Tiers Requis</th>
                <th class="p-4">Statut</th>
            </tr>
        </thead>
        <tbody id="coa-table-body" class="divide-y divide-gray-200 tabular-nums">
            {% for account in accounts %}
                {% include "accounting/_coa_row.html" %}
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
