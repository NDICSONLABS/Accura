{% extends "base.html" %}
{% block content %}
<div class="max-w-7xl mx-auto">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold">{{ _("Journal Entries") }}</h1>
        <a href="/accounting/journals/new"
           class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 font-medium">
            + {{ _("New Journal Entry") }}
        </a>
    </div>

    <div class="bg-white p-4 rounded-lg shadow mb-6">
        <form hx-get="/accounting/journals/"
              hx-target="#journal-rows"
              hx-swap="innerHTML"
              class="flex flex-wrap gap-4 items-end">

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">{{ _("Search") }}</label>
                <input type="text" name="search" value="{{ filters.search or '' }}"
                       placeholder="{{ _('Voucher, description, reference') }}"
                       hx-get="/accounting/journals/"
                       hx-trigger="keyup changed delay:300ms"
                       hx-target="#journal-rows"
                       hx-include="closest form"
                       class="block w-64 rounded-md border-gray-300 shadow-sm p-2 border">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">{{ _("Fiscal Year") }}</label>
                <select name="fy_id" class="block w-32 rounded-md border-gray-300 shadow-sm p-2 border">
                    <option value="">{{ _("All") }}</option>
                    {% for fy in fiscal_years %}
                        <option value="{{ fy.id }}" {% if filters.fiscal_year_id == fy.id %}selected{% endif %}>
                            {{ fy.code }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">{{ _("Journal") }}</label>
                <select name="journal_id" class="block w-40 rounded-md border-gray-300 shadow-sm p-2 border">
                    <option value="">{{ _("All") }}</option>
                    {% for j in journals %}
                        <option value="{{ j.id }}" {% if filters.journal_id == j.id %}selected{% endif %}>
                            {{ j.code }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">{{ _("Status") }}</label>
                <select name="status" class="block w-36 rounded-md border-gray-300 shadow-sm p-2 border">
                    <option value="">{{ _("All") }}</option>
                    {% for s in statuses %}
                        <option value="{{ s.value }}" {% if filters.status and filters.status.value == s.value %}selected{% endif %}>
                            {{ s.value }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">{{ _("From") }}</label>
                <input type="date" name="date_from" value="{{ filters.date_from or '' }}"
                       class="block w-40 rounded-md border-gray-300 shadow-sm p-2 border">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">{{ _("To") }}</label>
                <input type="date" name="date_to" value="{{ filters.date_to or '' }}"
                       class="block w-40 rounded-md border-gray-300 shadow-sm p-2 border">
            </div>

            <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
                {{ _("Filter") }}
            </button>
        </form>
    </div>

    <div class="bg-white shadow rounded-lg overflow-x-auto">
        <table class="w-full text-sm text-left">
            <thead class="bg-slate-800 text-white uppercase text-xs">
                <tr>
                    <th class="p-3">{{ _("Date") }}</th>
                    <th class="p-3">{{ _("Voucher") }}</th>
                    <th class="p-3">{{ _("Journal") }}</th>
                    <th class="p-3">{{ _("Description") }}</th>
                    <th class="p-3">{{ _("Created By") }}</th>
                    <th class="p-3">{{ _("Status") }}</th>
                </tr>
            </thead>
            <tbody id="journal-rows" class="divide-y divide-gray-200 bg-white">
                {% include "accounting/journals/_list_rows.html" %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
