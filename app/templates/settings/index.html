{% extends "base.html" %}
{% block content %}
<h1 class="text-2xl font-bold mb-6">{{ _("Settings") }}</h1>

{% if error %}
<div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4" role="alert">{{ error }}</div>
{% endif %}
{% if success %}
<div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4" role="alert">{{ success }}</div>
{% endif %}

<form hx-post="/settings/" hx-target="#settings-form" hx-swap="innerHTML" id="settings-form" class="max-w-2xl space-y-6 bg-white p-6 rounded-lg shadow">
    {% include "settings/_settings_form.html" %}
</form>
{% endblock %}
