{% if error %}
<div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4" role="alert">
    {{ tmsg(error) }}
</div>
{% endif %}

{% if success %}
<div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4" role="alert">
    {{ tmsg(success) }}
</div>
{% endif %}

<div class="space-y-4">
    <div class="flex items-center justify-between">
        <div>
            <label class="font-medium">{{ _("Multi-Devises (Multi-Currency)") }}</label>
            <p class="text-sm text-gray-500">
                {{ _("Activer la gestion des taux de change et des écritures en devises.") }}
            </p>
        </div>
        <input type="checkbox" name="multi_currency_enabled" value="true"
               {% if settings.multi_currency_enabled %}checked{% endif %}
               class="w-5 h-5 text-blue-600 rounded focus:ring-blue-500">
    </div>

    <div class="flex items-center justify-between">
        <div>
            <label class="font-medium">{{ _("Suivi par Bailleur (Donor Tracking)") }}</label>
            <p class="text-sm text-gray-500">
                {{ _("Activer les fonds dédiés (Classe 16x) et l'affectation par projet.") }}
            </p>
        </div>
        <input type="checkbox" name="donor_fund_tracking_enabled" value="true"
               {% if settings.donor_fund_tracking_enabled %}checked{% endif %}
               class="w-5 h-5 text-blue-600 rounded focus:ring-blue-500">
    </div>

    <div class="pt-4 border-t">
        <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
            {{ _("Enregistrer") }}
        </button>
    </div>
</div>
