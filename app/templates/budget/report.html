{% extends "base.html" %}
{% block content %}
<div class="max-w-7xl mx-auto">
    <h1 class="text-2xl font-bold mb-6">{{ _("Budget vs. Actual") }}</h1>

    <div class="bg-white p-4 rounded-lg shadow mb-6">
        <form
            hx-get="/budget/report"
            hx-target="#budget-table"
            hx-swap="innerHTML"
            class="flex flex-wrap gap-4 items-end"
        >
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    {{ _("Fiscal Year") }}
                </label>

                <select name="fy_id" class="block w-32 rounded-md border-gray-300 shadow-sm p-2 border">
                    {% for fy in fiscal_years %}
                        <option value="{{ fy.id }}" {% if fy.id == fy_id %}selected{% endif %}>
                            {{ fy.code }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    {{ _("Fund") }}
                </label>

                <select name="fund_id" class="block w-44 rounded-md border-gray-300 shadow-sm p-2 border">
                    <option value="">{{ _("All") }}</option>
                    {% for f in funds %}
                        <option value="{{ f.id }}" {% if f.id == fund_id %}selected{% endif %}>
                            {{ f.label }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    {{ _("Display Currency") }}
                </label>

                <select name="view_currency" class="block w-40 rounded-md border-gray-300 shadow-sm p-2 border">
                    <option value="XAF" {% if view_currency == 'XAF' %}selected{% endif %}>
                        XAF
                    </option>

                    <option value="GRANT" {% if view_currency == 'GRANT' %}selected{% endif %}>
                        {{ _("Donor Currency") }}
                    </option>
                </select>
            </div>

            <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
                {{ _("Filter") }}
            </button>
        </form>
    </div>

    <div id="budget-table" class="bg-white shadow rounded-lg overflow-x-auto">
        {% include "budget/_budget_table.html" %}
    </div>
</div>
{% endblock %}
