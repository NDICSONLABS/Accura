{% if success %}
<div class="bg-green-100 border border-green-400 text-green-800 px-4 py-3 rounded">
    <p class="font-medium">{{ tmsg(success) }}</p>
    {% if asset %}
        <a href="/assets/{{ asset.id }}" class="underline">{{ _("Open Asset") }}</a>
    {% endif %}
    {% if entry %}
        <a href="/accounting/journals/{{ entry.id }}" class="underline ml-3">{{ _("Open Entry") }}</a>
    {% endif %}
</div>
{% endif %}

{% if error %}
<div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">
    {{ error }}
</div>
{% endif %}
