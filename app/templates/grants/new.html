{% extends "base.html" %}
{% block content %}
<div class="max-w-4xl mx-auto">
    <h1 class="text-2xl font-bold mb-6">{{ _("New Grant") }}</h1>
    <form hx-post="/grants/create" hx-target="#grant-feedback" class="space-y-6 bg-white p-6 rounded-lg shadow">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div><label class="block text-sm font-medium text-gray-700">{{ _("Code") }}</label>
                <input type="text" name="code" required class="mt-1 block w-full p-2 border rounded"></div>
            <div><label class="block text-sm font-medium text-gray-700">{{ _("Label") }}</label>
                <input type="text" name="label" required class="mt-1 block w-full p-2 border rounded"></div>
            <div><label class="block text-sm font-medium text-gray-700">{{ _("Donor") }}</label>
                <select name="donor_third_party_id" class="mt-1 block w-full p-2 border rounded">
                    {% for d in donors %}<option value="{{ d.id }}">{{ d.name }}</option>{% endfor %}
                </select></div>
            <div><label class="block text-sm font-medium text-gray-700">{{ _("Restricted Fund") }}</label>
                <select name="fund_id" class="mt-1 block w-full p-2 border rounded">
                    {% for f in funds %}<option value="{{ f.id }}">{{ f.code }} — {{ f.label }} ({{ f.currency_code }})</option>{% endfor %}
                </select></div>
            <div><label class="block text-sm font-medium text-gray-700">{{ _("Currency") }}</label>
                <select name="currency_code" class="mt-1 block w-full p-2 border rounded">
                    {% for c in currencies %}<option value="{{ c.code }}">{{ c.code }}</option>{% endfor %}
                </select></div>
            <div><label class="block text-sm font-medium text-gray-700">{{ _("Committed Amount") }}</label>
                <input type="number" step="0.01" name="total_committed_foreign" class="mt-1 block w-full p-2 border rounded text-right tabular-nums"></div>
            <div><label class="block text-sm font-medium text-gray-700">{{ _("Start Date") }}</label>
                <input type="date" name="start_date" required class="mt-1 block w-full p-2 border rounded"></div>
            <div><label class="block text-sm font-medium text-gray-700">{{ _("End Date") }}</label>
                <input type="date" name="end_date" required class="mt-1 block w-full p-2 border rounded"></div>
            <div><label class="block text-sm font-medium text-gray-700">{{ _("Restricted Fund Account") }}</label>
                <select name="fund_account_code" class="mt-1 block w-full p-2 border rounded">
                    {% for a in fund_accounts %}<option value="{{ a.code }}" {% if a.code == '1611' %}selected{% endif %}>{{ a.code }} — {{ a.label }}</option>{% endfor %}
                </select></div>
        </div>
        <div id="grant-feedback"></div>
        <div class="flex justify-end gap-4">
            <a href="/grants/" class="px-4 py-2 border rounded">{{ _("Cancel") }}</a>
            <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">{{ _("Save Draft") }}</button>
        </div>
    </form>
</div>
{% endblock %}
