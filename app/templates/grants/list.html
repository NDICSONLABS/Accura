{% extends "base.html" %}
{% block content %}
<div class="max-w-7xl mx-auto">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold">{{ _("Donor Grants") }}</h1>
        <a href="/grants/new" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">+ {{ _("New Grant") }}</a>
    </div>
    <div class="bg-white shadow rounded-lg overflow-x-auto">
        <table class="w-full text-sm text-left">
            <thead class="bg-slate-800 text-white uppercase text-xs">
                <tr>
                    <th class="p-3">{{ _("Code") }}</th>
                    <th class="p-3">{{ _("Label") }}</th>
                    <th class="p-3">{{ _("Donor") }}</th>
                    <th class="p-3">{{ _("Currency") }}</th>
                    <th class="p-3 text-right">{{ _("Committed") }}</th>
                    <th class="p-3">{{ _("Status") }}</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-200">{% include "grants/_grant_rows.html" %}</tbody>
        </table>
    </div>
</div>
{% endblock %}
