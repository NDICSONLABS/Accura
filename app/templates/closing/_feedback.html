{% if success %}
<div class="bg-green-100 border border-green-400 text-green-800 px-4 py-3 rounded">
    <p class="font-medium">{{ tmsg(success) }}</p>
    <div class="mt-2 flex gap-3 text-sm">
        {% if run %}<a href="/closing/fx/{{ run.id }}" class="underline">{{ _("Open Revaluation") }}</a>{% endif %}
        {% if entry %}<a href="/accounting/journals/{{ entry.id }}" class="underline">{{ _("Open Entry") }}</a>{% endif %}
        {% if record %}<a href="/accounting/journals/{{ record.result_entry_id }}" class="underline">{{ _("Open Result Entry") }}</a>{% endif %}
        <a href="/closing/" class="underline">{{ _("Refresh Dashboard") }}</a>
    </div>
</div>
{% endif %}
{% if error %}
<div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">{{ error }}</div>
{% endif %}
