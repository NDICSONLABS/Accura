{% extends "base.html" %}
{% block content %}
<div class="max-w-5xl mx-auto" x-data="billForm()">
    <h1 class="text-2xl font-bold mb-6">{{ _("New Supplier Bill") }}</h1>

    <form hx-post="/accruals/bills/preview" hx-target="#gl-preview" hx-trigger="keyup changed delay:500ms from:#total-base, keyup changed delay:500ms from:#withholding-tax" class="space-y-6 bg-white p-6 rounded-lg shadow">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Fournisseur (Tiers)</label>
                <select name="supplier_id" id="supplier-id" x-model="supplierId" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
                    {% for s in suppliers %}
                        <option value="{{ s.id }}">{{ s.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Total Base (XAF)</label>
                <input type="number" name="total_base" id="total-base" x-model="totalBase" @input="updatePreview" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border tabular-nums" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Retenue à la source (447)</label>
                <input type="number" name="withholding_tax" id="withholding-tax" x-model="withholdingTax" @input="updatePreview" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border tabular-nums" value="0">
            </div>
        </div>

        <!-- Collapsible GL Preview Drawer -->
        <div id="gl-preview" class="bg-slate-50 border border-slate-200 rounded-lg p-4 mt-6">
            <h3 class="text-sm font-bold text-slate-700 uppercase mb-3">Aperçu des Écritures Comptables (GL Preview)</h3>
            <table class="w-full text-sm text-left">
                <thead class="text-slate-500 border-b">
                    <tr>
                        <th class="py-2">Compte</th>
                        <th class="py-2">Libellé</th>
                        <th class="py-2 text-right">Débit (XAF)</th>
                        <th class="py-2 text-right">Crédit (XAF)</th>
                    </tr>
                </thead>
                <tbody class="tabular-nums">
                    <tr>
                        <td class="py-2 font-mono">60x / 61x</td>
                        <td class="py-2">Charges (Lignes de facture)</td>
                        <td class="py-2 text-right text-green-700" x-text="formatMoney(totalBase)"></td>
                        <td class="py-2 text-right">-</td>
                    </tr>
                    <tr>
                        <td class="py-2 font-mono">401</td>
                        <td class="py-2" x-text="'Fournisseur: ' + supplierName"></td>
                        <td class="py-2 text-right">-</td>
                        <td class="py-2 text-right text-red-700" x-text="formatMoney(netPayable)"></td>
                    </tr>
                    <tr x-show="withholdingTax > 0">
                        <td class="py-2 font-mono">447</td>
                        <td class="py-2">État, impôts retenus à la source</td>
                        <td class="py-2 text-right">-</td>
                        <td class="py-2 text-right text-red-700" x-text="formatMoney(withholdingTax)"></td>
                    </tr>
                </tbody>
                <tfoot class="border-t font-bold bg-slate-100">
                    <tr>
                        <td colspan="2" class="py-2 text-right">Écart:</td>
                        <td class="py-2 text-right" x-text="formatMoney(totalBase)"></td>
                        <td class="py-2 text-right" x-text="formatMoney(netPayable + withholdingTax)"></td>
                    </tr>
                </tfoot>
            </table>
        </div>

        <div class="flex justify-end pt-4">
            <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 font-medium">Enregistrer la Facture</button>
        </div>
    </form>
</div>

<script>
function billForm() {
    return {
        supplierId: '',
        supplierName: '',
        totalBase: 0,
        withholdingTax: 0,
        get netPayable() { return Math.max(0, this.totalBase - this.withholdingTax); },
        
        updatePreview() {
            // In a real app, this would trigger an HTMX request or update Alpine state
            // For MVP, we update the supplier name reactively
            const select = document.getElementById('supplier-id');
            if(select) this.supplierName = select.options[select.selectedIndex].text;
        },
        formatMoney(amount) {
            return new Intl.NumberFormat('fr-CM', { style: 'currency', currency: 'XAF', maximumFractionDigits: 0 }).format(amount);
        }
    }
}
</script>
{% endblock %}
