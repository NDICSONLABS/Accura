{% extends "base.html" %}
{% block content %}
<div class="max-w-5xl mx-auto">
    <h1 class="text-3xl font-bold text-gray-800 mb-6">{{ _("Dashboard") }}</h1>
    
    <!-- Quick Stats -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <div class="bg-white p-6 rounded-lg shadow border-l-4 border-blue-500">
            <h3 class="text-gray-500 text-sm font-medium uppercase">{{ _("Total Entries") }}</h3>
            <p class="text-2xl font-bold text-gray-800 mt-2">0</p>
        </div>
        <div class="bg-white p-6 rounded-lg shadow border-l-4 border-green-500">
            <h3 class="text-gray-500 text-sm font-medium uppercase">{{ _("Open Periods") }}</h3>
            <p class="text-2xl font-bold text-gray-800 mt-2">1</p>
        </div>
        <div class="bg-white p-6 rounded-lg shadow border-l-4 border-yellow-500">
            <h3 class="text-gray-500 text-sm font-medium uppercase">{{ _("System Status") }}</h3>
            <p class="text-2xl font-bold text-green-600 mt-2">{{ _("Active") }}</p>
        </div>
    </div>

    <!-- Quick Actions -->
    <div class="bg-white p-6 rounded-lg shadow">
        <h2 class="text-xl font-semibold mb-4">{{ _("Quick Actions") }}</h2>
        <div class="flex flex-wrap gap-4">
            <a href="/accounting/journals/new" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">
                {{ _("New Journal Entry") }}
            </a>
            <a href="/accounting/coa/" class="bg-gray-200 text-gray-800 px-4 py-2 rounded hover:bg-gray-300 transition">
                {{ _("Chart of Accounts") }}
            </a>
            <a href="/settings/" class="bg-gray-200 text-gray-800 px-4 py-2 rounded hover:bg-gray-300 transition">
                {{ _("Settings") }}
            </a>
        </div>
    </div>
</div>
{% endblock %}
