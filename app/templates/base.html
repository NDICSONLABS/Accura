<!DOCTYPE html>
<html lang="{{ locale }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title or "Accura SYCEBNL" }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://unpkg.com/alpinejs@3.13.3" defer></script>
    <style> [x-cloak] { display: none !important; } </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans" hx-headers='{"X-CSRF-Token": "dummy-csrf-for-mvp"}'>
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-64 bg-slate-900 text-white flex flex-col">
            <div class="p-4 text-xl font-bold border-b border-slate-700">Accura SYCEBNL</div>
            <nav class="flex-1 p-4 space-y-2">
                <a href="/" class="block p-2 rounded hover:bg-slate-700">{{ _("Dashboard") }}</a>
                <a href="/accounting/coa/" class="block p-2 rounded hover:bg-slate-700">{{ _("Chart of Accounts") }}</a>

                <!-- Dynamic Navigation based on Settings (Injected via context in real app, simplified here) -->
                {% if settings and settings.multi_currency_enabled %}
                <a href="/accounting/fx/" class="block p-2 rounded hover:bg-slate-700 text-yellow-400">Devises (FX)</a>
                {% endif %}

                <a href="/settings/" class="block p-2 rounded hover:bg-slate-700 mt-8 border-t border-slate-700 pt-4">{{ _("Settings") }}</a>
            </nav>
            <div class="p-4 border-t border-slate-700 text-sm">
                <form action="/auth/logout" method="POST">
                    <button type="submit" class="text-red-400 hover:text-red-300">Déconnexion</button>
                </form>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto p-8">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
