{% extends "base.html" %}
{% block content %}
<div class="max-w-7xl mx-auto">
    <h1 class="text-2xl font-bold mb-6">{{ _("Grand Livre") }}</h1>

    <div class="bg-white p-4 rounded-lg shadow mb-6">
        <form
            hx-get="/reporting/gl"
            hx-target="#gl-table"
            hx-swap="innerHTML"
            class="flex flex-wrap gap-4 items-end"
        >
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    {{ _("Fiscal Year") }}
                </label>

                <select name="fy_id" class="block w-40 rounded-md border-gray-300 shadow-sm p-2 border">
                    <option value="">{{ _("All") }}</option>
                    {% for fy in fiscal_years %}
                        <option value="{{ fy.id }}" {% if filters.fiscal_year_id == fy.id %}selected{% endif %}>
                            {{ fy.code }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    {{ _("Account ID") }}
                </label>

                <input
                    type="text"
                    name="acc_id"
                    value="{{ filters.account_id or '' }}"
                    class="block w-32 rounded-md border-gray-300 shadow-sm p-2 border"
                >
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    {{ _("From") }}
                </label>

                <input
                    type="date"
                    name="date_from"
                    value="{{ filters.date_from or '' }}"
                    class="block w-40 rounded-md border-gray-300 shadow-sm p-2 border"
                >
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    {{ _("To") }}
                </label>

                <input
                    type="date"
                    name="date_to"
                    value="{{ filters.date_to or '' }}"
                    class="block w-40 rounded-md border-gray-300 shadow-sm p-2 border"
                >
            </div>

            <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
                {{ _("Filter") }}
            </button>
        </form>
    </div>

    <div id="gl-table" class="bg-white shadow rounded-lg overflow-x-auto">
        {% include "reporting/_gl_table.html" %}
    </div>
</div>
{% endblock %}
