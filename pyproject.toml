[project]
name = "accura"
version = "0.1.0"
description = "OHADA SYCEBNL Accounting System for NGOs in CEMAC"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.25",
    "alembic>=1.15.3",
    "psycopg[binary]>=3.1.18",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "passlib[argon2]>=1.7.4",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.3",
    "babel>=2.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "httpx>=0.27.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0",
    "testcontainers[postgres]>=4.0.0",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore:Accessing argon2.__version__ is deprecated:DeprecationWarning",
]


[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
disable_error_code = ["attr-defined", "union-attr", "arg-type", "assignment", "var-annotated"]