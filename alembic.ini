[alembic]
# This is the critical line that tells Alembic where to find the migrations
script_location = %(here)s/app/alembic

# The URL will be overridden by env.py using our Pydantic settings,
# but Alembic requires a placeholder to start.
sqlalchemy.url = postgresql+psycopg://postgres:postgres@localhost:5432/accuradb

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S